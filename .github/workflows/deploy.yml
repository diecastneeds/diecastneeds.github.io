name: Build and deploy site
on:
  push:
    branches: [main]        # change to your default branch if it isn't main
  workflow_dispatch:         # lets you trigger a rebuild manually from the Actions tab
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build catalog
        run: python build.py
      - name: Assemble published files
        run: |
          mkdir -p public
          cp index.html thankyou.html about.html events.html \
             contact.html shipping.html returns.html privacy.html public/
          cp logo.png public/ 2>/dev/null || true
          cp prices.json public/
          cp -r descs public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
