name: Build Catalog

on:
  push:
    paths:
      - 'products.xml'
      - 'logo.png'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python build.py
      - name: Commit output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html descs.json
          git diff --cached --quiet || git commit -m "Rebuild catalog"
          git push
